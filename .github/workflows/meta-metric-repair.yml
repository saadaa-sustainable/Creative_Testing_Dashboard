# CTD — Meta custom-conversion repair.
#
# FTEWV and NCP are resolved by NAME against the account's custom
# conversions. When that lookup misses, primary_sync stores nothing for them
# and the dashboard's F3/F4 filters (cost per NCP, cost per FTEWV) go dead.
# From 2026-08-19 the lookup was missing on every run and the daily sync,
# which rewrites a 16-day trailing window, overwrote three weeks of good
# values with zeros.
#
# Two jobs, run in this order:
#
#   diagnose  Lists every custom conversion Meta returns per account and says
#             whether CUSTOM_METRIC_FTEWV / CUSTOM_METRIC_NCP match one.
#             Read the log, then set those two repo secrets to names that
#             actually exist. Safe and read-only.
#
#   repair    Re-pulls a date range from Meta into primary_table, propagates
#             to backfill_table, and rebuilds the views. Run it only AFTER
#             diagnose reports a match, or it will just re-store nothing.

name: CTD Meta metric repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose (list conversions) or repair (re-pull a range)"
        required: true
        default: "diagnose"
        type: choice
        options:
          - diagnose
          - repair
      since:
        description: "repair only — first date to re-pull (YYYY-MM-DD)"
        required: false
        default: "2026-08-19"
      until:
        description: "repair only — last date (YYYY-MM-DD, blank = today)"
        required: false
        default: ""

concurrency:
  group: ctd-meta-repair
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A repair over a few weeks is a handful of Meta chunks per account, but
    # Meta throttling stretches it; the full-year default range needs room.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Which custom conversions does Meta have?
        env:
          # --- Supabase Postgres (required) ---
          # CTD scripts read SUPABASE_DB_URL primarily; cron_log.py
          # accepts either that or DATABASE_URL_SYNC.
          SUPABASE_DB_URL:              ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:            ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # --- Meta ads + Instagram ---
          META_ACCESS_TOKEN:            ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION:             ${{ secrets.META_API_VERSION }}
          IG_ACCESS_TOKEN:              ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID:               ${{ secrets.IG_BUSINESS_ID }}
          ACCOUNT_1_ID:                 ${{ secrets.ACCOUNT_1_ID }}
          ACCOUNT_1_NAME:               ${{ secrets.ACCOUNT_1_NAME }}
          ACCOUNT_2_ID:                 ${{ secrets.ACCOUNT_2_ID }}
          ACCOUNT_2_NAME:               ${{ secrets.ACCOUNT_2_NAME }}
          ACCOUNT_3_ID:                 ${{ secrets.ACCOUNT_3_ID }}
          ACCOUNT_3_NAME:               ${{ secrets.ACCOUNT_3_NAME }}
          SYNC_ACCOUNT_ID:              ${{ secrets.SYNC_ACCOUNT_ID }}
          CUSTOM_METRIC_FTEWV:          ${{ secrets.CUSTOM_METRIC_FTEWV }}
          CUSTOM_METRIC_NCP:            ${{ secrets.CUSTOM_METRIC_NCP }}

          # --- Google Ads ---
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # google-ads.yaml is written to disk at runtime from a secret
          # holding the whole YAML file (client_id / client_secret /
          # refresh_token live inside it).
          # This mirrors how the local .env sets it via GOOGLE_ADS_YAML.

          # --- Shopify ---
          SHOP_DOMAIN:                  ${{ secrets.SHOP_DOMAIN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN:   ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_ACCESS_TOKEN:         ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ADMIN_ACCESS_TOKEN:           ${{ secrets.ADMIN_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION:          ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_DATA_URL:             ${{ secrets.SHOPIFY_DATA_URL }}
          SHOPIFY_DATA_DB_URL:          ${{ secrets.SHOPIFY_DATA_DB_URL }}
          SHOPIFY_DATA_ANON:            ${{ secrets.SHOPIFY_DATA_ANON }}

          # --- Content Workflow + Creator Hub (2 companion Supabase projects) ---
          CONTENT_WORKFLOW_URL:         ${{ secrets.CONTENT_WORKFLOW_URL }}
          CONTENT_ANON_KEY:             ${{ secrets.CONTENT_ANON_KEY }}
          CONTENT_SERVICE_KEY:          ${{ secrets.CONTENT_SERVICE_KEY }}
          CREATOR_HUB_URL:              ${{ secrets.CREATOR_HUB_URL }}
          CREATOR_HUB_ACCESS:           ${{ secrets.CREATOR_HUB_ACCESS }}
          CREATOR_HUB_SERVICE_KEY:      ${{ secrets.CREATOR_HUB_SERVICE_KEY }}

          # --- API base for cache invalidation (safe to leave empty; wrapper
          # swallows a connection error) ---
          API_BASE:                     ${{ secrets.API_BASE }}
        run: python backend/list_custom_conversions.py

      - name: Re-pull the range and rebuild
        if: ${{ inputs.mode == 'repair' }}
        env:
          # --- Supabase Postgres (required) ---
          # CTD scripts read SUPABASE_DB_URL primarily; cron_log.py
          # accepts either that or DATABASE_URL_SYNC.
          SUPABASE_DB_URL:              ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:            ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # --- Meta ads + Instagram ---
          META_ACCESS_TOKEN:            ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION:             ${{ secrets.META_API_VERSION }}
          IG_ACCESS_TOKEN:              ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID:               ${{ secrets.IG_BUSINESS_ID }}
          ACCOUNT_1_ID:                 ${{ secrets.ACCOUNT_1_ID }}
          ACCOUNT_1_NAME:               ${{ secrets.ACCOUNT_1_NAME }}
          ACCOUNT_2_ID:                 ${{ secrets.ACCOUNT_2_ID }}
          ACCOUNT_2_NAME:               ${{ secrets.ACCOUNT_2_NAME }}
          ACCOUNT_3_ID:                 ${{ secrets.ACCOUNT_3_ID }}
          ACCOUNT_3_NAME:               ${{ secrets.ACCOUNT_3_NAME }}
          SYNC_ACCOUNT_ID:              ${{ secrets.SYNC_ACCOUNT_ID }}
          CUSTOM_METRIC_FTEWV:          ${{ secrets.CUSTOM_METRIC_FTEWV }}
          CUSTOM_METRIC_NCP:            ${{ secrets.CUSTOM_METRIC_NCP }}

          # --- Google Ads ---
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # google-ads.yaml is written to disk at runtime from a secret
          # holding the whole YAML file (client_id / client_secret /
          # refresh_token live inside it).
          # This mirrors how the local .env sets it via GOOGLE_ADS_YAML.

          # --- Shopify ---
          SHOP_DOMAIN:                  ${{ secrets.SHOP_DOMAIN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN:   ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_ACCESS_TOKEN:         ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ADMIN_ACCESS_TOKEN:           ${{ secrets.ADMIN_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION:          ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_DATA_URL:             ${{ secrets.SHOPIFY_DATA_URL }}
          SHOPIFY_DATA_DB_URL:          ${{ secrets.SHOPIFY_DATA_DB_URL }}
          SHOPIFY_DATA_ANON:            ${{ secrets.SHOPIFY_DATA_ANON }}

          # --- Content Workflow + Creator Hub (2 companion Supabase projects) ---
          CONTENT_WORKFLOW_URL:         ${{ secrets.CONTENT_WORKFLOW_URL }}
          CONTENT_ANON_KEY:             ${{ secrets.CONTENT_ANON_KEY }}
          CONTENT_SERVICE_KEY:          ${{ secrets.CONTENT_SERVICE_KEY }}
          CREATOR_HUB_URL:              ${{ secrets.CREATOR_HUB_URL }}
          CREATOR_HUB_ACCESS:           ${{ secrets.CREATOR_HUB_ACCESS }}
          CREATOR_HUB_SERVICE_KEY:      ${{ secrets.CREATOR_HUB_SERVICE_KEY }}

          # --- API base for cache invalidation (safe to leave empty; wrapper
          # swallows a connection error) ---
          API_BASE:                     ${{ secrets.API_BASE }}
        run: |
          set -e
          cd backend
          python primary_sync.py backfill "${{ inputs.since }}" "${{ inputs.until }}"
          # backfill_table is the lifetime store ae_table_view reads, so the
          # repaired values have to be carried across before the views are
          # rebuilt or nothing on the dashboard moves.
          python propagate_primary_to_backfill.py
          python refresh_ae_table.py
          cd ..
          python backend/_refresh_all_dashboard_data.py --phase mdviews

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-repair-${{ github.run_id }}
          path: |
            backend/logs/**/*.log
            backend/logs/**/*.json
            backend/*.log
          if-no-files-found: ignore
          retention-days: 14
