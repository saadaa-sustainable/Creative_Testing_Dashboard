# CTD — DB-only refresh steps, runnable on their own.
#
#   lp       public.refresh_landing_page_analysis_30d(30)
#            public.refresh_landing_page_ad_breakdown_30d(30)      (PHASE 4)
#   mdviews  REFRESH of meta_direct_active_30d / _90d and
#            meta_direct_daily_30d / _90d
#   rpcs     both of the above
#   snapshots
#            rebuild ad_result_snapshots (first-14-days + 50k-impressions
#            checkpoints behind the two Ads Analyse history columns)
#
# All three read tables that are already in Supabase — no Meta / Shopify /
# Google fetchers run — so the only secret needed is SUPABASE_DB_URL.
# Use this to repair a night where the full refresh died partway through
# (e.g. the 2026-09-03 run, killed by the subprocess cap after the
# meta_direct *active* views but before the *daily* ones).
#
# Trigger: Actions tab -> "CTD DB-only refresh" -> Run workflow -> pick phase.

name: CTD DB-only refresh

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Which DB-only step to run"
        required: true
        default: "lp"
        type: choice
        options:
          - lp
          - mdviews
          - rpcs
          - snapshots

concurrency:
  group: ctd-db-only-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The four matview REFRESHes take a few minutes; 60 leaves headroom if
    # the DB is busy behind a concurrent daily refresh.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Only what the DB-only steps import — skipping the full
        # requirements.txt keeps this job to well under a minute.
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary==2.9.9 python-dotenv==1.0.0

      - name: Run phase ${{ inputs.phase }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python backend/_refresh_all_dashboard_data.py --phase "${{ inputs.phase }}"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-only-refresh-log-${{ github.run_id }}
          path: |
            backend/logs/**/*.log
            backend/logs/**/*.json
          if-no-files-found: ignore
          retention-days: 14
